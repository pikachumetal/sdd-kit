language: powershell
tasks:
  test-fast:
    command: pwsh
    args: [-NoProfile, -Command, 'exit (Invoke-Pester -Path tests -ExcludeTagFilter Slow -PassThru -Output Minimal).FailedCount']
    options:
      cache: false
  test:
    command: pwsh
    args: [-NoProfile, -Command, 'exit (Invoke-Pester -Path tests -PassThru -Output Minimal).FailedCount']
    options:
      cache: false
  roadmap:
    command: pwsh
    args: [-NoProfile, -File, skills/sdd-templates/scripts/Test-Roadmap.ps1, -Path, .docs/sdd]
    options:
      cache: false
