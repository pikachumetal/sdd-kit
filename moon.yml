# Sin shell: en Windows moon envuelve cada tarea en pwsh o powershell.exe, y el repo no depende de PowerShell.
taskOptions:
  shell: false
tasks:
  # El gate la corre con --affected: solo cuando cambia el lanzador de sujetos o sus tests (0223).
  test-headless:
    command: node
    args: [cli/bin/sdd.js, lock, run, --, pnpm, --dir, cli, exec, vitest, run, test/kit/headless, --test-timeout, '120000', --maxWorkers, '8']
    # Fuera de esta tarea, cli/vitest.config.ts excluye test/kit/headless/ (0233).
    env:
      SDD_KIT_HEADLESS: '1'
    inputs:
      - '/tests/headless/**'
      - '/tests/batteries/**'
      - '/cli/test/kit/headless/**'
      - '/cli/test/kit/process.ts'
      - '/cli/test/temp-setup.ts'
      - '/cli/vitest.config.ts'
      - '/cli/package.json'
    options:
      cache: false
      mutex: heavy-tests
  roadmap:
    command: node
    args: [cli/bin/sdd.js, roadmap, check, --path, .docs/sdd]
    options:
      cache: false
  upstream:
    command: node
    args: [tests/upstream/check.ts]
    options:
      cache: false
