language: powershell
tasks:
  test-fast:
    command: pwsh
    args: [-NoProfile, -File, tests/Invoke-KitTests.ps1, -ExcludeTag, Slow]
    options:
      cache: false
  test:
    command: pwsh
    args: [-NoProfile, -File, tests/Invoke-KitTests.ps1]
    options:
      cache: false
  roadmap:
    command: node
    args: [cli/bin/sdd.js, roadmap, check, --path, .docs/sdd]
    options:
      cache: false
  upstream:
    command: node
    args: [tests/upstream/check.ts]
    options:
      cache: false
