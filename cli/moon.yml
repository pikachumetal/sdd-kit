language: typescript
# Los tests leen también las skills y las capacidades (docs-claims): sin ellas en los inputs,
# un commit que solo cambia una skill da cli:test por bueno desde la caché (patch 0183).
fileGroups:
  testInputs: ['/cli/**', '/skills/**', '/.docs/sdd/capabilities/**']
tasks:
  typecheck:
    command: pnpm
    args: [exec, tsc, --noEmit]
  test:
    command: pnpm
    args: [exec, vitest, run, --exclude, '**/*.slow.test.ts']
    inputs: ['@group(testInputs)']
  test-slow:
    command: pnpm
    args: [exec, vitest, run, slow.test, --test-timeout, '120000']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
  test-min:
    command: proto
    args: [run, node, 22.18.0, --, node_modules/vitest/vitest.mjs, run, --test-timeout, '120000']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
