language: typescript
tasks:
  typecheck:
    command: pnpm
    args: [exec, tsc, --noEmit]
  test:
    command: pnpm
    args: [exec, vitest, run, --exclude, '**/*.slow.test.ts']
  test-slow:
    command: pnpm
    args: [exec, vitest, run, slow.test, --test-timeout, '120000']
  test-min:
    command: proto
    args: [run, node, 22.18.0, --, node_modules/vitest/vitest.mjs, run, --test-timeout, '120000']
