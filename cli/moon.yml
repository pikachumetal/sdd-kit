language: typescript
# Los tests leen también las skills y las capacidades (docs-claims): sin ellas en los inputs,
# un commit que solo cambia una skill da cli:test por bueno desde la caché.
fileGroups:
  testInputs: ['/cli/**', '/skills/**', '/.docs/**', '/tests/**', '/hooks/**', '/.githooks/**', '/.claude/**', '/Start-KitSession.ps1']
tasks:
  typecheck:
    command: pnpm
    args: [exec, tsc, --noEmit]
  test:
    command: pnpm
    args: [exec, vitest, run, --exclude, '**/*.slow.test.ts']
    inputs: ['@group(testInputs)']
  # 8 workers: con los 32 por defecto, los ficheros lentos arrancan a la vez y con carga el test más lento pasa de 58 s.
  # Las dos con el cerrojo del clon: la suite de otro worktree espera a la que está en marcha (patch 0218).
  test-slow:
    command: node
    args: [bin/sdd.js, lock, run, --, pnpm, exec, vitest, run, slow.test, --exclude, '**/kit/headless/**', --test-timeout, '120000', --maxWorkers, '8']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
  test-min:
    command: node
    args: [bin/sdd.js, lock, run, --, proto, run, node, 22.18.0, --, node_modules/vitest/vitest.mjs, run, --exclude, '**/kit/headless/**', --test-timeout, '120000', --maxWorkers, '8']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
