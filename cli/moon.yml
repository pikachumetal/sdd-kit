language: typescript
# Los tests leen también el resto del repo: las skills y las capacidades (docs-claims), y en test/kit
# los topes, las rutas, los manifests, los agentes y .docs/workflow. Sin ellos en los inputs, un commit
# que solo cambia uno de esos ficheros da cli:test por bueno desde la caché.
fileGroups:
  testInputs: ['/cli/**', '/skills/**', '/.docs/**', '/README.md', '/.claude-plugin/**', '/agents/**', '/tests/**']
tasks:
  typecheck:
    command: pnpm
    args: [exec, tsc, --noEmit]
  test:
    command: pnpm
    args: [exec, vitest, run, --exclude, '**/*.slow.test.ts']
    inputs: ['@group(testInputs)']
  # 8 workers: con los 32 por defecto, los ficheros lentos arrancan a la vez y con carga el test más lento pasa de 58 s.
  # Las dos con el cerrojo del clon: la suite de otro worktree espera a la que está en marcha (patch 0218).
  test-slow:
    command: node
    args: [bin/sdd.js, lock, run, --, pnpm, exec, vitest, run, slow.test, --test-timeout, '120000', --maxWorkers, '8']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
  test-min:
    command: node
    args: [bin/sdd.js, lock, run, --, proto, run, node, 22.18.0, --, node_modules/vitest/vitest.mjs, run, --test-timeout, '120000', --maxWorkers, '8']
    inputs: ['@group(testInputs)']
    options:
      mutex: heavy-tests
