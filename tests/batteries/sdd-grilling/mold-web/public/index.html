<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reservas — salas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Reservas</h1>
  <table id="reservas">
    <thead><tr><th>Sala</th><th>Día</th><th>Franja</th><th>Quién</th></tr></thead>
    <tbody></tbody>
  </table>
  <script type="module">
    const reservas = await (await fetch('reservas.json')).json();
    document.querySelector('#reservas tbody').innerHTML = reservas
      .map((r) => `<tr><td>${r.sala}</td><td>${r.dia}</td><td>${r.franja}</td><td>${r.quien}</td></tr>`)
      .join('');
  </script>
</body>
</html>
