# CI de la base (tech-stack.md §Testing): la suite completa en cada push a develop y a las ramas de tarea, sin --affected.
name: ci
on:
  push:
    branches: [develop, 'feature/**', 'patch/**']
# Un job a la vez por rama, sin cancelar: los pushes seguidos esperan y se juntan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # cli:test-min corre con el mínimo del README.
      - run: proto install node 22.18.0
      - run: pnpm install --frozen-lockfile
      # mergiraf es obligatorio para la suite (tech-stack.md); proto no tiene plugin.
      - run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://codeberg.org/mergiraf/mergiraf/releases/download/v0.20.0/mergiraf_x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin" mergiraf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Los tests de sdd roadmap publish commitean con la identidad global; una propia, que no casa con la de nadie.
      - run: |
          git config --global user.name sdd-kit-ci
          git config --global user.email sdd-kit-ci@users.noreply.github.com
      - run: node cli/bin/sdd.js lock run -- moon run kit:test-headless cli:typecheck cli:test-min
