# CI de la base (.docs/sdd/steering/operations.md §Testing): la suite completa en cada push a develop y a las ramas de tarea, sin --affected.
name: ci
on:
  push:
    branches: [develop, 'feature/**', 'patch/**']
# Un job a la vez por rama, sin cancelar: los pushes seguidos esperan y se juntan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # cli:test-min corre con el mínimo del README.
      - run: proto install node 22.18.0
      - run: pnpm install --frozen-lockfile
      # mergiraf es obligatorio para la suite (.docs/sdd/steering/operations.md); proto no tiene plugin.
      # A un fichero y con reintentos: en tubería, una descarga cortada llegaba a tar a medias (ticket del patch 0260 §1).
      - run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/mergiraf.tar.gz" https://codeberg.org/mergiraf/mergiraf/releases/download/v0.20.0/mergiraf_x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/mergiraf.tar.gz" -C "$HOME/.local/bin" mergiraf
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Los tests de sdd roadmap publish commitean con la identidad global; una propia, que no casa con la de nadie.
      - run: |
          git config --global user.name sdd-kit-ci
          git config --global user.email sdd-kit-ci@users.noreply.github.com
      # kit:copies compara cada copia con su original en el tag de upstream.json: un clon entero, con tags, por fuente.
      - run: |
          mkdir -p "$RUNNER_TEMP/upstream"
          for repo in $(node -e "for (const source of Object.values(require('./upstream.json').sources)) console.log(source.repo)"); do
            git clone -q "https://github.com/$repo.git" "$RUNNER_TEMP/upstream/${repo//\//-}"
          done
          echo "SDD_UPSTREAM_DIR=$RUNNER_TEMP/upstream" >> "$GITHUB_ENV"
      - run: node cli/bin/sdd.js lock run -- moon run kit:test-headless cli:typecheck cli:test-min kit:copies kit:own kit:skill-size
